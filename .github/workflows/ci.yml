name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  forge:
    name: Forge build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      # Install the two deps the remappings reference. No --no-commit:
      # newer Foundry removed that flag, older Foundry commits the submodule
      # and needs a git identity. Setting an identity works on both.
      - name: Install dependencies
        run: |
          git config user.email "ci@lazylions.local"
          git config user.name "CI"
          forge install foundry-rs/forge-std
          forge install OpenZeppelin/openzeppelin-contracts
      - name: Build
        run: forge build --sizes
      - name: Test
        run: forge test -vvv
